name: Build EW30SX firmware + signed APK feeds

on:
  # The reference schedule is intentionally disabled; builds are manual.
  # schedule:
  #   - cron: '0 0 */14 * *'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub prerelease with both image profiles and their feeds
        type: boolean
        default: false

concurrency:
  group: build-ew30sx
  cancel-in-progress: false

permissions:
  contents: read

env:
  PAGES_BASE: ${{ vars.EW30SX_PAGES_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      upstream: ${{ steps.upstream.outputs.commit }}
      gitmodules: ${{ steps.upstream.outputs.gitmodules }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: tag
        run: echo "value=ew30sx-$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}" >>"$GITHUB_OUTPUT"
      - name: Resolve the latest upstream tip for both profiles
        id: upstream
        run: |
          set -euo pipefail
          url=$(git config -f .gitmodules --get submodule.openwrt-nss-edma.url)
          branch=$(git config -f .gitmodules --get submodule.openwrt-nss-edma.branch)
          commit=$(git ls-remote --exit-code "$url" "refs/heads/$branch" | cut -f1)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
          echo "gitmodules=$(git rev-parse HEAD:.gitmodules)" >>"$GITHUB_OUTPUT"

  build:
    needs: metadata
    name: Build ${{ matrix.flavor }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        flavor: [nor, ram]
    env:
      FLAVOR: ${{ matrix.flavor }}
      TAG: ${{ needs.metadata.outputs.tag }}
      UPSTREAM_COMMIT: ${{ needs.metadata.outputs.upstream }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install build dependencies
        run: |
          set -euo pipefail
          free=$(df -PB1 "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }')
          if (( free < 40 * 1024 * 1024 * 1024 )); then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          fi
          df -hT "$GITHUB_WORKSPACE"
          sudo apt-get update
          sudo apt-get install -y build-essential bzip2 file flex gawk gettext git \
            glibc-source libelf-dev libncurses-dev libssl-dev python3 python3-setuptools \
            rsync unzip wget zlib1g-dev

      - name: Check out latest OpenWrt and apply EW30SX patches
        run: |
          set -euo pipefail
          git submodule update --init -- openwrt-nss-edma
          if ! git -C openwrt-nss-edma cat-file -e "$UPSTREAM_COMMIT^{commit}" 2>/dev/null; then
            git -C openwrt-nss-edma fetch --no-tags origin "$UPSTREAM_COMMIT"
          fi
          git -C openwrt-nss-edma switch --detach "$UPSTREAM_COMMIT"
          for patch in "$PWD"/patches/*.patch; do
            git -C openwrt-nss-edma apply --index "$patch" ||
              git -C openwrt-nss-edma apply --3way "$patch" || {
                echo "::error::EW30SX patch ${patch##*/} no longer applies to $UPSTREAM_COMMIT"
                exit 1
              }
          done
          git submodule status

      - name: Configure firmware
        env:
          PUBLISH_PAGES: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_PAGES" == true ]]; then
            export FEED_URL="${PAGES_BASE%/}/$TAG/$FLAVOR/apk/target"
          fi
          bash .github/ci/configure.sh "$FLAVOR"

      - name: Compute compiler cache keys
        id: cache
        working-directory: openwrt-nss-edma
        run: |
          set -euo pipefail
          inputs=$({
            git rev-parse HEAD
            ./scripts/feeds list -fs
            ./scripts/diffconfig.sh
            sha256sum ../patches/*.patch
          } | sha256sum | cut -c1-24)
          toolchain=$({
            git rev-parse HEAD:toolchain HEAD:tools/ccache
            grep -E '^CONFIG_(ARCH|BINUTILS|GCC|LIBC|MUSL|TARGET_OPTIMIZATION)' .config
            gcc --version
            as --version
            getconf GNU_LIBC_VERSION
          } | sha256sum | cut -c1-24)
          echo "inputs=$inputs" >>"$GITHUB_OUTPUT"
          echo "ccache-prefix=ew30sx-ccache-v1-$FLAVOR-$RUNNER_OS-$RUNNER_ARCH-${ImageOS:-unknown}-$toolchain-" >>"$GITHUB_OUTPUT"

      - name: Restore source archives
        id: sources
        uses: actions/cache/restore@v6
        with:
          path: openwrt-nss-edma/dl
          key: ew30sx-dl-v1-inventory
          restore-keys: ew30sx-dl-v1-

      - name: Download sources
        working-directory: openwrt-nss-edma
        timeout-minutes: 75
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: '1000'
          GIT_HTTP_LOW_SPEED_TIME: '60'
          CURL_OPTIONS: --speed-limit 1000 --speed-time 60
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if timeout --kill-after=60 20m make download -j"$(nproc)"; then exit 0; fi
            echo "::warning::source download attempt $attempt failed"
            find dl -maxdepth 1 -name '*.dl' -printf '::warning::unfinished: %f (%s bytes)\n' || true
          done
          exit 1

      - name: Inventory downloaded archives
        id: archives
        working-directory: openwrt-nss-edma
        run: |
          set -euo pipefail
          find dl -maxdepth 1 -type f \( -name '*.dl' -o -name '*.hash' \) -delete
          inventory=$(find dl -maxdepth 1 -type f -printf '%f %s\n' | LC_ALL=C sort | sha256sum | cut -c1-24)
          echo "key=ew30sx-dl-v1-$inventory" >>"$GITHUB_OUTPUT"

      - name: Save source archives
        if: steps.archives.outputs.key != steps.sources.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: openwrt-nss-edma/dl
          key: ${{ steps.archives.outputs.key }}

      - name: Restore compiler cache
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: openwrt-nss-edma/.ccache
          key: ${{ steps.cache.outputs.ccache-prefix }}${{ steps.cache.outputs.inputs }}
          restore-keys: ${{ steps.cache.outputs.ccache-prefix }}

      - name: Build firmware
        working-directory: openwrt-nss-edma
        env:
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 4G
        run: |
          set -euo pipefail
          if ! make -j"$(nproc)"; then
            make -j1 V=s 2>&1 | tail -300
            exit 1
          fi

      - name: Save compiler cache
        if: steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: openwrt-nss-edma/.ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Verify firmware and collect the signed matching kmod feed
        working-directory: openwrt-nss-edma
        run: |
          set -euo pipefail
          make package/index
          bash ../.github/ci/collect.sh "$FLAVOR" "../out/$FLAVOR"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.TAG }}-${{ matrix.flavor }}
          path: out/${{ matrix.flavor }}/firmware/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Upload matching signed kmod feed
        uses: actions/upload-artifact@v4
        with:
          name: kmods-${{ env.TAG }}-${{ matrix.flavor }}
          path: out/${{ matrix.flavor }}/apk/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  update_submodule:
    name: Record successful upstream revision
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [metadata, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      UPSTREAM_COMMIT: ${{ needs.metadata.outputs.upstream }}
      BUILT_GITMODULES: ${{ needs.metadata.outputs.gitmodules }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Advance the gitlink without overwriting newer commits
        run: |
          set -euo pipefail
          submodule=openwrt-nss-edma
          current=$(git rev-parse "HEAD:$submodule")
          if [[ "$current" == "$UPSTREAM_COMMIT" ]]; then exit 0; fi
          if [[ "$(git rev-parse HEAD:.gitmodules)" != "$BUILT_GITMODULES" ]] ||
             ! git diff --quiet "$GITHUB_SHA" HEAD -- patches .github; then
            echo "::error::build inputs changed on $DEFAULT_BRANCH; run CI again"
            exit 1
          fi

          # Inspect upstream commit history, but never execute its code in this write-enabled job.
          url=$(git config -f .gitmodules --get "submodule.$submodule.url")
          branch=$(git config -f .gitmodules --get "submodule.$submodule.branch")
          history=$(mktemp -d "$RUNNER_TEMP/openwrt-gitlink.XXXXXX")
          git clone --bare --filter=blob:none --single-branch --branch "$branch" "$url" "$history"
          git -C "$history" merge-base --is-ancestor "$UPSTREAM_COMMIT" "refs/heads/$branch"
          if git -C "$history" merge-base --is-ancestor "$UPSTREAM_COMMIT" "$current"; then exit 0; fi
          git -C "$history" merge-base --is-ancestor "$current" "$UPSTREAM_COMMIT"

          git update-index --cacheinfo "160000,$UPSTREAM_COMMIT,$submodule"
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore: update OpenWrt submodule to ${UPSTREAM_COMMIT:0:12}"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"

  publish:
    name: Publish retained builds to GitHub Pages
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [metadata, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TAG: ${{ needs.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ env.TAG }}-*"
          path: ${{ runner.temp }}/ew30sx-downloads
      - name: Update the gh-pages snapshot
        run: |
          set -euo pipefail
          downloads="$RUNNER_TEMP/ew30sx-downloads"
          mkdir site
          for flavor in nor ram; do
            mkdir -p "incoming/$flavor"
            mv "$downloads/firmware-$TAG-$flavor" "incoming/$flavor/firmware"
            mv "$downloads/kmods-$TAG-$flavor" "incoming/$flavor/apk"
          done
          # An empty listing means a missing branch; an auth or network
          # error must stop the job rather than discard the saved builds.
          remote=$(git ls-remote origin refs/heads/gh-pages)
          prev=''
          if [[ -n "$remote" ]]; then
            git fetch --no-tags --depth=1 origin refs/heads/gh-pages
            prev=$(git rev-parse FETCH_HEAD)
            git archive "$prev" | tar -x -C site
          fi

          bash .github/ci/prepare-pages.sh site incoming "$TAG"
          # Use a separate index so neither source files nor incoming
          # artifacts outside site can end up in the Pages branch.
          export GIT_INDEX_FILE="$RUNNER_TEMP/ew30sx-pages-index"
          git --work-tree="$PWD/site" add -A
          tree=$(git write-tree)
          if [[ -n "$prev" && "$tree" == "$(git rev-parse "$prev^{tree}")" ]]; then exit 0; fi
          # gh-pages is generated: one snapshot commit, without stale
          # binaries in history. Never overwrite a concurrent publication.
          commit=$(git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit-tree "$tree" -m "pages: retain build $TAG")
          git push --force-with-lease="refs/heads/gh-pages:$prev" origin "$commit:refs/heads/gh-pages"
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  release:
    name: Publish GitHub prerelease
    if: inputs.publish_release && needs.publish.result == 'success'
    needs: [metadata, build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.metadata.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ env.TAG }}-*"
          path: ${{ runner.temp }}/ew30sx-downloads
      - name: Publish raw firmware and matching kmod archives
        run: |
          set -euo pipefail
          downloads="$RUNNER_TEMP/ew30sx-downloads"
          mkdir release
          for flavor in nor ram; do
            firmware="$downloads/firmware-$TAG-$flavor"
            feed="$downloads/kmods-$TAG-$flavor"
            test -s "$feed/target/packages.adb"
            test -s "$feed/public-key.pem"
            for file in "$firmware"/*; do
              name=${file##*/}
              case "$name" in
                sha256sums) continue ;;
                *.itb|*.squashfs) cp "$file" "release/$name" ;;
                *) cp "$file" "release/$flavor-$name" ;;
              esac
            done
            tar -czf "release/$TAG-$flavor-apk-feed.tar.gz" -C "$feed" .
          done
          (cd release && sha256sum -- *.itb *.squashfs *.tar.gz >sha256sums)
          printf '%s\n' \
            'EW30SX experimental build. The split NOR pair is not a factory or sysupgrade image.' \
            'Never flash the RAM FIT. Keep each profile with its own signed APK feeds.' \
            "Build log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >release-notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "EW30SX OpenWrt $TAG" --prerelease --notes-file release-notes.md \
            release/*
